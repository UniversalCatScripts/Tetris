
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>TETRIS</title>
<style>
:root {
  color-scheme: dark;
  --bg: #171717;
  --panel: #252525;
  --panel2: #303030;
  --line: #555;
  --text: #f1f1e8;
  --muted: #bdbdb2;
  --accent: #d6d6c8;
  --cell: #b8b8a8;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Courier New", ui-monospace, monospace;
  display: grid;
  place-items: center;
  padding: 10px 12px 54px;
}
button {
  appearance: none;
  border: 2px solid #77776c;
  border-radius: 4px;
  background: linear-gradient(#45453e, #30302b);
  color: var(--text);
  padding: 10px 12px;
  font: bold .95rem "Courier New", monospace;
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: 0 3px 0 #111;
  user-select: none;
}
button:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #111;
}
button:focus-visible {
  outline: 3px solid white;
  outline-offset: 3px;
}
.app {
  width: min(920px, 100%);
  display: grid;
  grid-template-columns: minmax(112px, 155px) minmax(220px, 300px) minmax(112px, 155px);
  grid-template-rows: auto 1fr;
  gap: 12px;
  align-items: center;
  justify-content: center;
}
h1 {
  grid-column: 1 / -1;
  text-align: center;
  margin: 0;
  font-size: clamp(1.5rem, 4vh, 2.5rem);
  line-height: 1;
  letter-spacing: .16em;
  color: #f0f0e5;
  text-shadow: 3px 3px #555;
}
h1 span { color: #bdbda9; }
.side {
  min-width: 0;
  display: grid;
  gap: 10px;
  align-content: center;
}
.panel {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  padding: 10px;
  text-align: center;
  box-shadow: 3px 3px 0 #090909;
}
.panel h2 {
  margin: 0 0 5px;
  color: var(--muted);
  font-size: .78rem;
  letter-spacing: .12em;
}
.value {
  font-size: clamp(1.2rem, 3vh, 1.8rem);
  font-weight: bold;
}
.small {
  color: var(--muted);
  font-size: .76rem;
  line-height: 1.45;
}
#status { overflow-wrap: anywhere; }
.boardCol {
  min-width: 0;
  display: grid;
  justify-items: center;
  gap: 9px;
}
#boardWrap {
  position: relative;
  padding: 5px;
  background: #080808;
  border: 3px solid #858579;
  border-radius: 3px;
  box-shadow: 5px 5px 0 #090909;
  line-height: 0;
}
#board {
  display: block;
  width: auto;
  height: min(64vh, 600px);
  height: min(64dvh, 600px);
  max-width: 100%;
  aspect-ratio: 1 / 2;
  image-rendering: pixelated;
}
#overlay {
  position: absolute;
  inset: 5px;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  background: #080808eF;
  text-align: center;
  line-height: 1.3;
}
#overlay strong {
  font-size: clamp(1.2rem, 4vh, 2rem);
  color: #eee;
}
#next {
  display: block;
  width: min(100%, 120px);
  height: auto;
  margin: auto;
}

/* NEW DIRECTIONAL CONTROLS */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 100%;
}
.controls button {
  width: 54px;
  height: 43px;
  padding: 5px;
  font-size: 1.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
}
.direction-row {
  display: flex;
  justify-content: center;
  gap: 55px;
}
.controls .rotate-control {
  font-size: 2rem;
  width: 54px;
  height: 43px;
  line-height: 1;
}
.controls .down-control {
  margin-top: 0;
}
.extraActions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  width: 100%;
}
.extraActions button {
  min-width: 0;
  padding: 9px 5px;
}
.wide { width: 100%; }
kbd {
  background: #45453e;
  border: 1px solid #777;
  border-radius: 2px;
  padding: 1px 4px;
  color: white;
}
#musicBtn {
  position: fixed;
  right: max(12px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 5;
  min-width: 116px;
  font-size: .8rem;
  padding: 9px 11px;
}
@media (max-height: 700px) and (min-width: 701px) {
  body { padding-top: 6px; padding-bottom: 48px; }
  .app { gap: 8px; }
  .side { gap: 7px; }
  .panel { padding: 7px; }
  #board {
    height: min(58vh, 510px);
    height: min(58dvh, 510px);
  }
  .small { font-size: .68rem; }
}
@media (max-width: 700px) {
  body {
    display: block;
    padding: 12px 10px 62px;
  }
  .app {
    width: min(520px, 100%);
    margin: 0 auto;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 9px;
    align-items: start;
  }
  h1 {
    grid-column: 1 / -1;
    margin: 3px 0 5px;
    font-size: 2rem;
  }
  .boardCol {
    grid-column: 1 / -1;
    grid-row: 2;
    width: 100%;
  }
  #board {
    height: min(48vh, 430px);
    height: min(48dvh, 430px);
  }
  .leftCol { grid-column: 1; grid-row: 3; }
  .rightCol { grid-column: 2; grid-row: 3; }
  .side { gap: 8px; }
  .panel { padding: 8px; }
  .value { font-size: 1.25rem; }
  .small { font-size: .68rem; }
  #musicBtn {
    bottom: max(8px, env(safe-area-inset-bottom));
    right: max(8px, env(safe-area-inset-right));
  }
}
@media (max-width: 360px) {
  .direction-row { gap: 40px; }
  .controls button {
    min-height: 40px;
    font-size: 1rem;
  }
  .controls .rotate-control { font-size: 1.8rem; }
  button { font-size: .82rem; }
}
</style>
</head>
<body>
<main class="app">
  <h1>TETRIS</h1>

  <section class="side leftCol">
    <div class="panel">
      <h2>SCORE</h2>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel">
      <h2>HIGH SCORE</h2>
      <div class="value" id="high">0</div>
    </div>
    <div class="panel">
      <h2>LEVEL</h2>
      <div class="value" id="level">1</div>
    </div>
    <button class="wide" id="startBtn">NEW GAME</button>
  </section>

  <section class="boardCol">
    <div id="boardWrap">
      <canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas>
      <div id="overlay">
        <strong>GAME OVER</strong>
        <div id="finalScore">Score: 0</div>
        <button id="againBtn">PLAY AGAIN</button>
      </div>
    </div>

    <!-- NEW CONTROL LAYOUT -->
    <div class="controls" aria-label="Game controls">
      <button id="rotateBtn" class="rotate-control"
        aria-label="Rotate piece" title="Rotate">↻</button>

      <div class="direction-row">
        <button id="left" aria-label="Move left">◀</button>
        <button id="right" aria-label="Move right">▶</button>
      </div>

      <button id="down" class="down-control"
        aria-label="Soft drop">▼</button>
    </div>

    <div class="extraActions">
      <button id="drop">HARD DROP</button>
      <button id="pauseBtn" aria-pressed="false">PAUSE (P)</button>
    </div>
  </section>

  <section class="side rightCol">
    <div class="panel">
      <h2>NEXT PIECE</h2>
      <canvas id="next" width="120" height="100"></canvas>
    </div>
    <div class="panel">
      <h2>HOW TO PLAY</h2>
      <div class="small">
        Fill a row to clear it.<br><br>
        <kbd>←</kbd> <kbd>→</kbd> Move<br>
        <kbd>R</kbd> Rotate<br>
        <kbd>↓</kbd> Soft drop<br>
        <kbd>Space</kbd> Hard drop<br>
        <kbd>P</kbd> Pause
      </div>
    </div>
    <div class="panel">
      <h2>STATUS</h2>
      <div id="status" class="small">Press New Game.</div>
    </div>
  </section>
</main>

<button id="musicBtn" aria-pressed="false">♫ MUSIC: OFF</button>
<audio id="bgMusic" src="music.mp3" loop preload="none"></audio>


<script>
(() => {
  const COLS = 10, ROWS = 20;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nctx = document.getElementById('next').getContext('2d');

  const colors = [
    null, '#777777', '#b0b0a0', '#858585',
    '#c4c4b4', '#99998b', '#666666', '#aaaa9a'
  ];

  const shapes = [
    [[1,1,1,1]],
    [[2,2],[2,2]],
    [[0,3,0],[3,3,3]],
    [[4,0,0],[4,4,4]],
    [[0,0,5],[5,5,5]],
    [[0,6,6],[6,6,0]],
    [[7,7,0],[0,7,7]]
  ];

  let grid, piece, next;
  let score = 0, lines = 0, level = 1;
  let dropCounter = 0, last = 0;
  let interval = 850;
  let running = false, paused = false, raf = 0;
  let high = 0;

  try {
    high = Number(localStorage.getItem('blockdropHigh') || 0);
  } catch (_) {}

  const $ = id => document.getElementById(id);
  $('high').textContent = high;

  function empty() {
    return Array.from(
      { length: ROWS },
      () => Array(COLS).fill(0)
    );
  }

  function randomPiece() {
    const m = shapes[
      Math.floor(Math.random() * shapes.length)
    ].map(r => r.slice());

    return {
      m,
      x: Math.floor((COLS - m[0].length) / 2),
      y: 0
    };
  }

  function rotate(m) {
    return m[0].map((_, i) =>
      m.map(row => row[i]).reverse()
    );
  }

  function collide(p, dx = 0, dy = 0, m = p.m) {
    for (let y = 0; y < m.length; y++) {
      for (let x = 0; x < m[y].length; x++) {
        if (m[y][x]) {
          const nx = p.x + x + dx;
          const ny = p.y + y + dy;

          if (
            nx < 0 ||
            nx >= COLS ||
            ny >= ROWS ||
            (ny >= 0 && grid[ny][nx])
          ) {
            return true;
          }
        }
      }
    }
    return false;
  }

  function drawCell(c, x, y, size, context) {
    if (!c) return;

    context.fillStyle = colors[c];
    context.fillRect(
      x * size + 1,
      y * size + 1,
      size - 2,
      size - 2
    );

    context.fillStyle = 'rgba(255,255,255,.18)';
    context.fillRect(
      x * size + 3,
      y * size + 3,
      size - 6,
      Math.max(2, size * .1)
    );

    context.strokeStyle = '#303030';
    context.strokeRect(
      x * size + 1,
      y * size + 1,
      size - 2,
      size - 2
    );
  }

  function drawNext() {
    nctx.clearRect(0, 0, 120, 100);
    if (!next) return;

    const s = 23;
    const w = next.m[0].length * s;
    const h = next.m.length * s;
    const ox = (120 - w) / 2;
    const oy = (100 - h) / 2;

    for (let y = 0; y < next.m.length; y++) {
      for (let x = 0; x < next.m[y].length; x++) {
        if (next.m[y][x]) {
          drawCell(
            next.m[y][x],
            x + ox / s,
            y + oy / s,
            s,
            nctx
          );
        }
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#080808';
    ctx.fillRect(0, 0, 300, 600);

    const s = 30;

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        ctx.strokeStyle = '#292929';
        ctx.strokeRect(x * s, y * s, s, s);
        drawCell(grid[y][x], x, y, s, ctx);
      }
    }

    if (piece) {
      for (let y = 0; y < piece.m.length; y++) {
        for (let x = 0; x < piece.m[y].length; x++) {
          if (piece.m[y][x]) {
            drawCell(
              piece.m[y][x],
              piece.x + x,
              piece.y + y,
              s,
              ctx
            );
          }
        }
      }
    }

    drawNext();
  }

  function update() {
    $('score').textContent = score.toLocaleString();
    $('level').textContent = level;
    $('high').textContent = high.toLocaleString();
  }

  function spawn() {
    piece = next || randomPiece();

    piece.x = Math.floor(
      (COLS - piece.m[0].length) / 2
    );
    piece.y = 0;

    next = randomPiece();

    if (collide(piece)) endGame();

    draw();
  }

  function lock() {
    for (let y = 0; y < piece.m.length; y++) {
      for (let x = 0; x < piece.m[y].length; x++) {
        if (piece.m[y][x]) {
          const yy = piece.y + y;

          if (yy < 0) {
            endGame();
            return;
          }

          grid[yy][piece.x + x] = piece.m[y][x];
        }
      }
    }

    let cleared = 0;

    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(Boolean)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(0));
        cleared++;
        y++;
      }
    }

    if (cleared) {
      lines += cleared;
      score += [0, 100, 300, 500, 800][cleared] * level;

      level = 1 + Math.floor(lines / 10);
      interval = Math.max(110, 850 - (level - 1) * 65);

      update();
    }

    spawn();
  }

  function step() {
    if (!running || paused) return;

    if (!collide(piece, 0, 1)) {
      piece.y++;
    } else {
      lock();
    }

    draw();
  }

  function loop(t = 0) {
    if (!running) return;

    const dt = t - last;
    last = t;

    if (!paused) {
      dropCounter += dt;

      if (dropCounter > interval) {
        step();
        dropCounter = 0;
      }
    }

    raf = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(raf);

    grid = empty();
    score = 0;
    lines = 0;
    level = 1;
    interval = 850;

    dropCounter = 0;
    running = true;
    paused = false;
    next = randomPiece();

    $('pauseBtn').textContent = 'PAUSE (P)';
    $('pauseBtn').setAttribute('aria-pressed', 'false');

    $('overlay').style.display = 'none';
    $('status').textContent = 'Playing';

    update();
    spawn();

    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    cancelAnimationFrame(raf);

    if (score > high) {
      high = score;

      try {
        localStorage.setItem(
          'blockdropHigh',
          String(high)
        );
      } catch (_) {}
    }

    update();

    $('finalScore').textContent = 'Score: ' + score;
    $('overlay').style.display = 'flex';
    $('status').textContent = 'Game over';
  }

  function move(dx) {
    if (!running || paused) return;

    if (!collide(piece, dx, 0)) {
      piece.x += dx;
    }

    draw();
  }

  function turn() {
    if (!running || paused) return;

    const m = rotate(piece.m);

    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collide(piece, kick, 0, m)) {
        piece.m = m;
        piece.x += kick;
        break;
      }
    }

    draw();
  }

  function soft() {
    if (!running || paused) return;

    if (!collide(piece, 0, 1)) {
      piece.y++;
      score++;
      update();
    } else {
      lock();
    }

    draw();
  }

  function hard() {
    if (!running || paused) return;

    let distance = 0;

    while (!collide(piece, 0, 1)) {
      piece.y++;
      distance++;
    }

    score += distance * 2;
    update();
    lock();
    draw();
  }

  function pause() {
    if (!running) {
      $('status').textContent =
        'Start a game before pausing.';
      return;
    }

    paused = !paused;

    $('status').textContent =
      paused ? 'Paused' : 'Playing';

    $('pauseBtn').textContent =
      paused ? 'RESUME (P)' : 'PAUSE (P)';

    $('pauseBtn').setAttribute(
      'aria-pressed',
      String(paused)
    );

    if (!paused) {
      last = performance.now();
      dropCounter = 0;
    }
  }

  // Directional controls
  $('left').addEventListener('click', () => move(-1));
  $('right').addEventListener('click', () => move(1));
  $('rotateBtn').addEventListener('click', turn);
  $('down').addEventListener('click', soft);

  // Other game controls
  $('drop').addEventListener('click', hard);
  $('pauseBtn').addEventListener('click', pause);
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);

  // Keyboard controls
  document.addEventListener('keydown', e => {
    if (
      ['ArrowLeft', 'ArrowRight', 'ArrowDown', ' ']
      .includes(e.key)
    ) {
      e.preventDefault();
    }

    if (e.key === 'ArrowLeft') {
      move(-1);
    } else if (e.key === 'ArrowRight') {
      move(1);
    } else if (e.key.toLowerCase() === 'r') {
      turn();
    } else if (e.key === 'ArrowDown') {
      soft();
    } else if (e.code === 'Space') {
      hard();
    } else if (e.key.toLowerCase() === 'p') {
      pause();
    } else if (e.key === 'Enter' && !running) {
      start();
    }
  });

  // Music controls
  const music = $('bgMusic');
  const musicBtn = $('musicBtn');

  function setMusicButton(isOn) {
    musicBtn.textContent =
      isOn ? '♫ MUSIC: ON' : '♫ MUSIC: OFF';

    musicBtn.setAttribute(
      'aria-pressed',
      String(isOn)
    );
  }

  musicBtn.addEventListener('click', async () => {
    if (music.paused) {
      musicBtn.textContent = '♫ MUSIC: LOADING…';

      try {
        await music.play();

        setMusicButton(true);
        $('status').textContent = 'Music playing';
      } catch (error) {
        setMusicButton(false);

        $('status').textContent =
          'Music could not start. Upload a file named music.mp3 beside index.html.';
      }
    } else {
      music.pause();
      setMusicButton(false);

      $('status').textContent =
        running ? (paused ? 'Paused' : 'Playing') : 'Music off';
    }
  });

  music.addEventListener('play', () => {
    setMusicButton(true);
  });

  music.addEventListener('pause', () => {
    setMusicButton(false);
  });

  music.addEventListener('error', () => {
    setMusicButton(false);

    $('status').textContent =
      'Cannot find or play music.mp3. Check that it is uploaded beside index.html.';
  });

  // Initialize game
  grid = empty();
  draw();
  update();

})();
</script>
</body>
</html>
