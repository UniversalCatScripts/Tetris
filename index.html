<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>TETRIS</title>
<script src="https://accounts.google.com/gsi/client" async defer onload="window.__gsiOk=1;window.__initG&&window.__initG()" onerror="window.__gsiBad=1;window.__initG&&window.__initG()"></script>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#252525;--line:#555;--text:#f1f1e8;--muted:#bdbdb2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;display:grid;place-items:center;padding:10px 12px 54px}
button{appearance:none;border:2px solid #77776c;border-radius:4px;background:linear-gradient(#45453e,#30302b);color:var(--text);padding:10px 12px;font:bold .95rem "Courier New",monospace;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 0 #111;user-select:none}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{display:none!important}
.app{width:min(920px,100%);display:grid;grid-template-columns:minmax(112px,155px) minmax(220px,300px) minmax(112px,155px);grid-template-rows:auto 1fr;gap:12px;align-items:center;justify-content:center}
h1{grid-column:1/-1;text-align:center;margin:0;font-size:clamp(1.5rem,4vh,2.5rem);line-height:1;letter-spacing:.16em;color:#f0f0e5;text-shadow:3px 3px #555}
.side{min-width:0;display:grid;gap:10px;align-content:center}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:10px;text-align:center;box-shadow:3px 3px 0 #090909}
.panel h2{margin:0 0 5px;color:var(--muted);font-size:.78rem;letter-spacing:.12em}
.value{font-size:clamp(1.2rem,3vh,1.8rem);font-weight:bold}
.small{color:var(--muted);font-size:.76rem;line-height:1.45}
#status{overflow-wrap:anywhere}
.boardCol{min-width:0;display:grid;justify-items:center;gap:9px}
#boardWrap{position:relative;padding:5px;background:#080808;border:3px solid #858579;border-radius:3px;box-shadow:5px 5px 0 #090909;line-height:0}
#board{display:block;width:auto;height:min(64vh,600px);height:min(64dvh,600px);max-width:100%;aspect-ratio:1/2;image-rendering:pixelated}
#overlay{position:absolute;inset:5px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:#080808ef;text-align:center;line-height:1.3}
#overlay strong{font-size:clamp(1.2rem,4vh,2rem);color:#eee}
#next{display:block;width:min(100%,120px);height:auto;margin:auto}
.controls{display:flex;flex-direction:column;align-items:center;gap:7px;width:100%}
.controls button{width:54px;height:43px;padding:5px;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.direction-row{display:flex;justify-content:center;gap:55px}
.controls .rotate-control{font-size:2rem;line-height:1}
.extraActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
.extraActions button{min-width:0;padding:9px 5px}
.wide{width:100%}
kbd{background:#45453e;border:1px solid #777;border-radius:2px;padding:1px 4px;color:#fff}
#musicBtn{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:20;min-width:116px;font-size:.8rem;padding:9px 11px}

/* HOME SCREEN */
#home{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#fall{position:absolute;inset:0;width:100%;height:100%}
.homeBox{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;background:#171717cc;border:2px solid var(--line);border-radius:4px;box-shadow:5px 5px 0 #090909;width:min(340px,90%)}
.homeBox h1{font-size:clamp(2rem,8vw,3rem);margin-bottom:8px}
#menu,#login{display:flex;flex-direction:column;gap:12px;width:100%;align-items:center}
#menu button{width:100%;padding:14px 12px;font-size:1.05rem}
#gnote{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.4}
#profile{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:2}
#pbtn{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;max-width:210px}
#pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#555;display:grid;place-items:center;flex:none;font-size:.9rem}
.av img{width:100%;height:100%;object-fit:cover}
#pmenu{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:8px;width:190px}
#pmenu.open{display:flex}
#pmenu button{width:100%;font-size:.82rem;padding:9px 8px}
#lb{position:fixed;inset:0;z-index:30;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
#lb.open{display:flex}
#lbBox{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:16px;width:min(380px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#lbBox h2{margin:0;text-align:center;letter-spacing:.12em}
.row{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid #444;border-radius:3px}
.row.me{border-color:#d6d6c8;background:#333}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rk{width:1.6em;color:var(--muted)}
@media (max-height:700px) and (min-width:701px){body{padding-top:6px;padding-bottom:48px}.app{gap:8px}.side{gap:7px}.panel{padding:7px}#board{height:min(58vh,510px);height:min(58dvh,510px)}.small{font-size:.68rem}}
@media (max-width:700px){
body{display:block;padding:12px 10px 62px}
.app{width:min(520px,100%);margin:0 auto;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:9px;align-items:start}
h1{margin:3px 0 5px;font-size:2rem}
.boardCol{grid-column:1/-1;grid-row:2;width:100%}
#board{height:min(48vh,430px);height:min(48dvh,430px)}
.leftCol{grid-column:1;grid-row:3}.rightCol{grid-column:2;grid-row:3}
.side{gap:8px}.panel{padding:8px}.value{font-size:1.25rem}.small{font-size:.68rem}
#musicBtn{bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right))}}
@media (max-width:360px){.direction-row{gap:40px}.controls button{min-height:40px;font-size:1rem}.controls .rotate-control{font-size:1.8rem}button{font-size:.82rem}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <canvas id="fall"></canvas>
  <div id="profile" class="hide">
    <button id="pbtn" aria-haspopup="true"><span class="av" id="pav"></span><span id="pname"></span></button>
    <div id="pmenu">
      <button id="chName">CHANGE NAME</button>
      <button id="chPic">CHANGE PHOTO</button>
      <button id="logout">SIGN OUT</button>
    </div>
    <input type="file" id="picFile" accept="image/*" hidden>
  </div>
  <div class="homeBox">
    <h1>TETRIS</h1>
    <div id="login">
      <div id="gbtn"></div>
      <div id="gnote"></div>
      <button id="guestBtn">PLAY AS GUEST</button>
    </div>
    <div id="menu" class="hide">
      <button id="newBtn">NEW GAME</button>
      <button id="contBtn" class="hide">CONTINUE GAME</button>
      <button id="lbBtn">LEADERBOARDS</button>
    </div>
  </div>
</div>

<div id="lb"><div id="lbBox"><h2>LEADERBOARDS</h2><div id="lbList"></div><button id="lbClose">CLOSE</button></div></div>

<!-- GAME -->
<main class="app hide" id="app">
  <h1>TETRIS</h1>
  <section class="side leftCol">
    <div class="panel"><h2>SCORE</h2><div class="value" id="score">0</div></div>
    <div class="panel"><h2>HIGH SCORE</h2><div class="value" id="high">0</div></div>
    <div class="panel"><h2>LEVEL</h2><div class="value" id="level">1</div></div>
    <button class="wide" id="startBtn">NEW GAME</button>
  </section>
  <section class="boardCol">
    <div id="boardWrap">
      <canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas>
      <div id="overlay"><strong>GAME OVER</strong><div id="finalScore">Score: 0</div><button id="againBtn">PLAY AGAIN</button></div>
    </div>
    <div class="controls" aria-label="Game controls">
      <button id="rotateBtn" class="rotate-control" aria-label="Rotate piece" title="Rotate">↻</button>
      <div class="direction-row">
        <button id="left" aria-label="Move left">◀</button>
        <button id="right" aria-label="Move right">▶</button>
      </div>
      <button id="down" aria-label="Soft drop">▼</button>
    </div>
    <div class="extraActions">
      <button id="drop">HARD DROP</button>
      <button id="pauseBtn" aria-pressed="false">PAUSE (P)</button>
      <button id="menuBtn" style="grid-column:1/-1">MENU</button>
    </div>
  </section>
  <section class="side rightCol">
    <div class="panel"><h2>NEXT PIECE</h2><canvas id="next" width="120" height="100"></canvas></div>
    <div class="panel"><h2>HOW TO PLAY</h2>
      <div class="small">Fill a row to clear it.<br><br>
        <kbd>←</kbd> <kbd>→</kbd> Move<br><kbd>R</kbd> Rotate<br><kbd>↓</kbd> Soft drop<br><kbd>Space</kbd> Hard drop<br><kbd>P</kbd> Pause</div>
    </div>
    <div class="panel"><h2>STATUS</h2><div id="status" class="small">Press New Game.</div></div>
  </section>
</main>

<button id="musicBtn" aria-pressed="false">♫ MUSIC: OFF</button>
<audio id="bgMusic" src="music.mp3" loop preload="none"></audio>

<script>
(() => {
  // ====== CONFIG: pega aquí tu OAuth Client ID de Google ======
  const CLIENT_ID = '864144764016-4l2mgrpb5utb4c4gdr3tphabb560gu6k.apps.googleusercontent.com';
  // ====== CONFIG: Firebase (leaderboard global). Déjalo vacío para usar solo ranking local ======
  const FIREBASE = { apiKey: 'AIzaSyAonDSVKS6Y8-Prye_n6BAwXsGFqtuwLog', projectId: 'tetris-515307' };
  // ============================================================

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
  const COLS = 10, ROWS = 20;
  const canvas = $('board'), ctx = canvas.getContext('2d'), nctx = $('next').getContext('2d');
  const colors = [null,'#777777','#b0b0a0','#858585','#c4c4b4','#99998b','#666666','#aaaa9a'];
  const shapes = [[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,0,0],[4,4,4]],[[0,0,5],[5,5,5]],[[0,6,6],[6,6,0]],[[7,7,0],[0,7,7]]];

  /* ---------- USER / STORAGE ---------- */
  let user = null;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} }
  };
  const K = s => 'tetris:' + user.sub + ':' + s;
  const okPic = p => /^(https:|data:image\/)/.test(p || '');
  const av = u => okPic(u.pic) ? '<img src="' + esc(u.pic) + '" referrerpolicy="no-referrer" alt="">' : '<span>' + esc((u.name || '?')[0].toUpperCase()) + '</span>';

  // Guests: id único por dispositivo (para que no se pisen entre ellos en el ranking global)
  const isGuest = () => !!user && user.sub === 'guest';
  function guestId() {
    let g = store.get('tetrisGuestId', null);
    if (!g) {
      g = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)).replace(/[^a-zA-Z0-9]/g, '').slice(0, 20);
      store.set('tetrisGuestId', g);
    }
    return g;
  }
  const docId = () => isGuest() ? 'guest_' + guestId() : user.sub;   // id del documento en Firestore
  const isMe = e => !!user && e.sub === docId();
  function login(sub, name, pic) {
    store.set('tetrisUser', { sub, name, pic });
    if (sub === 'guest') {
      // Perfil fijo: ignora cualquier nombre/foto guardados antes
      user = { sub, name: 'Guest ' + guestId().slice(0, 4).toUpperCase(), pic: '' };
    } else {
      const o = store.get('tetris:' + sub + ':prof', {});
      user = { sub, name: o.name || name, pic: o.pic || pic || '' };
    }
    renderHome();
  }
  function saveProf() {
    if (isGuest()) return;   // los guests no pueden cambiar su perfil
    store.set(K('prof'), { name: user.name, pic: user.pic });
    const l = store.get('tetrisLB', []);
    l.forEach(e => { if (e.sub === user.sub) { e.name = user.name; e.pic = user.pic; } });
    store.set('tetrisLB', l);
    submitGlobal(store.get(K('gbest'), 0), true);
    renderHome();
  }
  function logout() {
    user = null; store.del('tetrisUser');
    try { google.accounts.id.disableAutoSelect(); } catch (_) {}
    $('pmenu').classList.remove('open');
    renderHome();
  }
  function jwt(t) {
    const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(p))));
  }
  function initGoogle() {
    if (!window.google || !google.accounts) {
      if (window.__gsiBad) $('gnote').textContent = 'Google script blocked. Disable your ad blocker for this page, check your connection, and open the game from http(s) in a normal browser tab (not an embedded preview).';
      return;
    }
    if (CLIENT_ID.startsWith('YOUR_')) { $('gnote').textContent = 'Set your CLIENT_ID in the code to enable Google Sign-In.'; return; }
    if (window.__gDone) return; window.__gDone = true;
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: r => { try { const p = jwt(r.credential); login(p.sub, p.name || 'Player', p.picture || ''); } catch (_) { $('gnote').textContent = 'Sign-in failed. Try again.'; } }
    });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'large', shape: 'rectangular' });
  }

  function hasSave() { return !!user && !!store.get(K('save'), null); }
  function renderHome() {
    const si = !!user;
    $('login').classList.toggle('hide', si);
    $('menu').classList.toggle('hide', !si);
    $('profile').classList.toggle('hide', !si);
    if (si) {
      $('pname').textContent = user.name;
      $('pav').innerHTML = av(user);
      $('contBtn').classList.toggle('hide', !hasSave());
      $('chName').classList.toggle('hide', isGuest());
      $('chPic').classList.toggle('hide', isGuest());
    }
  }

  /* ---------- LEADERBOARD (local to this browser) ---------- */
  function best() { const e = store.get('tetrisLB', []).find(x => x.sub === user.sub); return e ? e.score : 0; }
  function addScore(s) {
    const l = store.get('tetrisLB', []);
    let e = l.find(x => x.sub === user.sub);
    if (!e) { e = { sub: user.sub, score: 0 }; l.push(e); }
    e.name = user.name; e.pic = user.pic;
    if (s > e.score) e.score = s;
    l.sort((a, b) => b.score - a.score);
    store.set('tetrisLB', l.slice(0, 20));
  }
  const FB_ON = !!(FIREBASE.apiKey && FIREBASE.projectId);
  const FB_BASE = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE.projectId + '/databases/(default)/documents';
  function submitGlobal(sc, force) {
    if (!FB_ON || !user || !sc) return;
    if (!force && sc <= store.get(K('gbest'), 0)) return;
    const sub = user.sub, id = docId();
    fetch(FB_BASE + '/scores/' + encodeURIComponent(id) + '?key=' + FIREBASE.apiKey, {
      method: 'PATCH', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: {
        name: { stringValue: user.name }, pic: { stringValue: okPic(user.pic) ? user.pic : '' },
        score: { integerValue: String(sc) }, updated: { integerValue: String(Date.now()) } } })
    }).then(async r => { if (r.ok) { store.set('tetris:' + sub + ':gbest', sc); window.__subErr = ''; } else { window.__subErr = 'Save failed (' + r.status + '): ' + ((await r.text()).slice(0, 160)); console.warn(window.__subErr); } }).catch(e => { window.__subErr = 'Save failed: ' + e.message; console.warn(window.__subErr); });
  }
  async function fetchGlobal() {
    const r = await fetch(FB_BASE + ':runQuery?key=' + FIREBASE.apiKey, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ structuredQuery: { from: [{ collectionId: 'scores' }],
        orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: 20 } })
    });
    if (!r.ok) throw new Error(r.status + ': ' + (await r.text()).slice(0, 160));
    return (await r.json()).filter(x => x.document).map(x => {
      const f = x.document.fields || {};
      return { sub: x.document.name.split('/').pop(), name: (f.name && f.name.stringValue) || 'Player',
               pic: (f.pic && f.pic.stringValue) || '', score: Number((f.score && f.score.integerValue) || 0) };
    });
  }
  async function showLB() {
    $('lbList').innerHTML = '<div class="small" style="text-align:center">Loading…</div>';
    $('lb').classList.add('open');
    let l = null, note = '';
    if (FB_ON) { try { l = await fetchGlobal(); } catch (e) { note = 'Could not load the global leaderboard (' + esc(e.message) + '). Showing scores from this device.'; } }
    else note = 'Global leaderboard is not configured. Showing scores from this device.';
    if (!l) l = store.get('tetrisLB', []);
    if (window.__subErr) note += ' ' + esc(window.__subErr);
    $('lbList').innerHTML = (note ? '<div class="small" style="text-align:center;margin-bottom:8px">' + note + '</div>' : '') +
      (l.length ? l.map((e, i) =>
      '<div class="row' + (isMe(e) ? ' me' : '') + '"><span class="rk">' + (i + 1) + '</span><span class="av">' + av(e) +
      '</span><span class="n">' + esc(e.name) + '</span><b>' + e.score.toLocaleString() + '</b></div>').join('')
      : '<div class="small" style="text-align:center">No scores yet. Play a game!</div>');
  }

  /* ---------- HOME UI ---------- */
  $('guestBtn').onclick = () => login('guest', 'Guest', '');
  $('pbtn').onclick = e => { e.stopPropagation(); $('pmenu').classList.toggle('open'); };
  document.addEventListener('click', () => $('pmenu').classList.remove('open'));
  $('logout').onclick = logout;
  $('chName').onclick = () => {
    if (isGuest()) return;
    const n = prompt('New name (max 16 characters):', user.name);
    if (n && n.trim()) { user.name = n.trim().slice(0, 16); saveProf(); }
  };
  $('chPic').onclick = () => { if (!isGuest()) $('picFile').click(); };
  $('picFile').onchange = e => {
    if (isGuest()) { e.target.value = ''; return; }
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = 96;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 96, 96);
        user.pic = c.toDataURL('image/jpeg', .8); saveProf();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f); e.target.value = '';
  };
  $('lbBtn').onclick = showLB;
  $('lbClose').onclick = () => $('lb').classList.remove('open');
  $('lb').onclick = e => { if (e.target === $('lb')) $('lb').classList.remove('open'); };

  /* ---------- FALLING BLOCKS ---------- */
  const fc = $('fall'), fx = fc.getContext('2d');
  let blocks = [], fraf = 0, inHome = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fsize() { fc.width = innerWidth; fc.height = innerHeight; }
  function newBlock(anywhere) {
    const m = shapes[Math.floor(Math.random() * shapes.length)];
    const s = 16 + Math.floor(Math.random() * 18);
    return { m, s, x: Math.random() * (fc.width - s * 3), y: anywhere ? Math.random() * fc.height : -s * 4,
             v: .6 + Math.random() * 1.6, a: .2 + Math.random() * .35 };
  }
  function fall() {
    if (!inHome) return;
    fx.clearRect(0, 0, fc.width, fc.height);
    blocks.forEach((b, i) => {
      if (!reduce) b.y += b.v;
      if (b.y > fc.height) blocks[i] = newBlock(false);
      fx.globalAlpha = b.a;
      b.m.forEach((row, cy) => row.forEach((c, cx) => {
        if (!c) return;
        fx.fillStyle = colors[c];
        fx.fillRect(b.x + cx * b.s, b.y + cy * b.s, b.s - 2, b.s - 2);
        fx.fillStyle = 'rgba(255,255,255,.25)';
        fx.fillRect(b.x + cx * b.s + 2, b.y + cy * b.s + 2, b.s - 6, 2);
      }));
    });
    fx.globalAlpha = 1;
    fraf = requestAnimationFrame(fall);
  }
  function startFall() {
    cancelAnimationFrame(fraf); fsize();
    blocks = Array.from({ length: 26 }, () => newBlock(true));
    fall();
  }
  addEventListener('resize', () => { if (inHome) fsize(); });

  /* ---------- GAME ---------- */
  let grid, piece, next;
  let score = 0, lines = 0, level = 1, dropCounter = 0, last = 0, interval = 850;
  let running = false, paused = false, raf = 0, high = 0;

  const empty = () => Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  function randomPiece() {
    const m = shapes[Math.floor(Math.random() * shapes.length)].map(r => r.slice());
    return { m, x: Math.floor((COLS - m[0].length) / 2), y: 0 };
  }
  const rotate = m => m[0].map((_, i) => m.map(r => r[i]).reverse());
  function collide(p, dx = 0, dy = 0, m = p.m) {
    for (let y = 0; y < m.length; y++) for (let x = 0; x < m[y].length; x++) if (m[y][x]) {
      const nx = p.x + x + dx, ny = p.y + y + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && grid[ny][nx])) return true;
    }
    return false;
  }
  function drawCell(c, x, y, size, context) {
    if (!c) return;
    context.fillStyle = colors[c];
    context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.fillStyle = 'rgba(255,255,255,.18)';
    context.fillRect(x * size + 3, y * size + 3, size - 6, Math.max(2, size * .1));
    context.strokeStyle = '#303030';
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
  }
  function drawNext() {
    nctx.clearRect(0, 0, 120, 100);
    if (!next) return;
    const s = 23, w = next.m[0].length * s, h = next.m.length * s, ox = (120 - w) / 2, oy = (100 - h) / 2;
    for (let y = 0; y < next.m.length; y++) for (let x = 0; x < next.m[y].length; x++)
      if (next.m[y][x]) drawCell(next.m[y][x], x + ox / s, y + oy / s, s, nctx);
  }
  function draw() {
    ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, 300, 600);
    const s = 30;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      ctx.strokeStyle = '#292929'; ctx.strokeRect(x * s, y * s, s, s);
      drawCell(grid[y][x], x, y, s, ctx);
    }
    if (piece) for (let y = 0; y < piece.m.length; y++) for (let x = 0; x < piece.m[y].length; x++)
      if (piece.m[y][x]) drawCell(piece.m[y][x], piece.x + x, piece.y + y, s, ctx);
    drawNext();
  }
  function update() {
    $('score').textContent = score.toLocaleString();
    $('level').textContent = level;
    $('high').textContent = Math.max(high, score).toLocaleString();
  }
  function spawn() {
    piece = next || randomPiece();
    piece.x = Math.floor((COLS - piece.m[0].length) / 2); piece.y = 0;
    next = randomPiece();
    if (collide(piece)) endGame();
    draw();
  }
  function saveGame() {
    if (!running || !user) return;
    store.set(K('save'), { grid, piece, next, score, lines, level, interval });
  }
  function lock() {
    for (let y = 0; y < piece.m.length; y++) for (let x = 0; x < piece.m[y].length; x++) if (piece.m[y][x]) {
      const yy = piece.y + y;
      if (yy < 0) { endGame(); return; }
      grid[yy][piece.x + x] = piece.m[y][x];
    }
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) if (grid[y].every(Boolean)) {
      grid.splice(y, 1); grid.unshift(Array(COLS).fill(0)); cleared++; y++;
    }
    if (cleared) {
      lines += cleared;
      score += [0, 100, 300, 500, 800][cleared] * level;
      level = 1 + Math.floor(lines / 10);
      interval = Math.max(110, 850 - (level - 1) * 65);
      update();
    }
    spawn();
    saveGame();
  }
  function step() {
    if (!running || paused) return;
    if (!collide(piece, 0, 1)) piece.y++; else lock();
    draw();
  }
  function loop(t = 0) {
    if (!running) return;
    const dt = t - last; last = t;
    if (!paused) { dropCounter += dt; if (dropCounter > interval) { step(); dropCounter = 0; } }
    raf = requestAnimationFrame(loop);
  }
  function resetUI(msg) {
    $('pauseBtn').textContent = 'PAUSE (P)';
    $('pauseBtn').setAttribute('aria-pressed', 'false');
    $('overlay').style.display = 'none';
    $('status').textContent = msg;
  }
  function start() {
    if (hasSave() && !running && !confirm('Start a new game? Your saved game will be lost.')) return;
    cancelAnimationFrame(raf);
    grid = empty(); score = 0; lines = 0; level = 1; interval = 850; dropCounter = 0;
    running = true; paused = false; next = randomPiece();
    store.del(K('save'));
    resetUI('Playing'); update(); spawn();
    last = performance.now(); raf = requestAnimationFrame(loop);
  }
  function resume() {
    const s = store.get(K('save'), null);
    if (!s) return start();
    cancelAnimationFrame(raf);
    ({ grid, piece, next, score, lines, level, interval } = s);
    dropCounter = 0; running = true; paused = false;
    resetUI('Playing'); update(); draw();
    last = performance.now(); raf = requestAnimationFrame(loop);
  }
  function endGame() {
    running = false; cancelAnimationFrame(raf);
    store.del(K('save'));
    addScore(score); submitGlobal(score);
    high = Math.max(high, score);
    update();
    $('finalScore').textContent = 'Score: ' + score;
    $('overlay').style.display = 'flex';
    $('status').textContent = 'Game over';
  }
  const move = dx => { if (!running || paused) return; if (!collide(piece, dx, 0)) piece.x += dx; draw(); };
  function turn() {
    if (!running || paused) return;
    const m = rotate(piece.m);
    for (const k of [0, -1, 1, -2, 2]) if (!collide(piece, k, 0, m)) { piece.m = m; piece.x += k; break; }
    draw();
  }
  function soft() {
    if (!running || paused) return;
    if (!collide(piece, 0, 1)) { piece.y++; score++; update(); } else lock();
    draw();
  }
  function hard() {
    if (!running || paused) return;
    let d = 0;
    while (!collide(piece, 0, 1)) { piece.y++; d++; }
    score += d * 2; update(); lock(); draw();
  }
  function pause() {
    if (!running) { $('status').textContent = 'Start a game before pausing.'; return; }
    paused = !paused;
    $('status').textContent = paused ? 'Paused' : 'Playing';
    $('pauseBtn').textContent = paused ? 'RESUME (P)' : 'PAUSE (P)';
    $('pauseBtn').setAttribute('aria-pressed', String(paused));
    if (!paused) { last = performance.now(); dropCounter = 0; }
  }

  /* ---------- SCREEN SWITCHING ---------- */
  function showGame() {
    inHome = false; cancelAnimationFrame(fraf);
    $('home').classList.add('hide'); $('app').classList.remove('hide');
    high = best(); update(); draw();
  }
  function toHome() {
    if (running) { if (score > 0) { addScore(score); submitGlobal(score); } saveGame(); running = false; cancelAnimationFrame(raf); }
    inHome = true;
    $('app').classList.add('hide'); $('home').classList.remove('hide');
    renderHome(); startFall();
  }
  $('newBtn').onclick = () => {
    if (hasSave() && !confirm('Start a new game? Your saved game will be lost.')) return;
    store.del(K('save')); showGame(); start();
  };
  $('contBtn').onclick = () => { showGame(); resume(); };
  $('menuBtn').onclick = toHome;
  document.addEventListener('visibilitychange', () => { if (document.hidden && !inHome) saveGame(); });
  addEventListener('pagehide', () => { if (!inHome) saveGame(); });

  /* ---------- CONTROLS ---------- */
  $('left').onclick = () => move(-1);
  $('right').onclick = () => move(1);
  $('rotateBtn').onclick = turn;
  $('down').onclick = soft;
  $('drop').onclick = hard;
  $('pauseBtn').onclick = pause;
  $('startBtn').onclick = start;
  $('againBtn').onclick = start;

  document.addEventListener('keydown', e => {
    if (inHome) return;
    if (['ArrowLeft', 'ArrowRight', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key.toLowerCase() === 'r') turn();
    else if (e.key === 'ArrowDown') soft();
    else if (e.code === 'Space') hard();
    else if (e.key.toLowerCase() === 'p') pause();
    else if (e.key === 'Enter' && !running) start();
  });

  /* ---------- MUSIC ---------- */
  const music = $('bgMusic'), musicBtn = $('musicBtn');
  function setMusicButton(on) {
    musicBtn.textContent = on ? '♫ MUSIC: ON' : '♫ MUSIC: OFF';
    musicBtn.setAttribute('aria-pressed', String(on));
  }
  musicBtn.addEventListener('click', async () => {
    if (music.paused) {
      musicBtn.textContent = '♫ MUSIC: LOADING…';
      try { await music.play(); setMusicButton(true); $('status').textContent = 'Music playing'; }
      catch (_) { setMusicButton(false); $('status').textContent = 'Music could not start. Upload a file named music.mp3 beside index.html.'; }
    } else {
      music.pause(); setMusicButton(false);
      $('status').textContent = running ? (paused ? 'Paused' : 'Playing') : 'Music off';
    }
  });
  music.addEventListener('play', () => setMusicButton(true));
  music.addEventListener('pause', () => setMusicButton(false));
  music.addEventListener('error', () => { setMusicButton(false); $('status').textContent = 'Cannot find or play music.mp3. Check that it is uploaded beside index.html.'; });

  /* ---------- INIT ---------- */
  grid = empty(); draw();
  const saved = store.get('tetrisUser', null);
  if (saved && saved.sub) login(saved.sub, saved.name, saved.pic); else renderHome();
  startFall();
  window.__initG = initGoogle;
  initGoogle();
  setTimeout(() => { if (!window.google) { window.__gsiBad = true; initGoogle(); } }, 6000);
})();
</script>
</body>
