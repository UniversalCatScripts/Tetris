<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris Enhanced</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>body{margin:0;background:#111;color:#fff;font-family:Arial}#home{height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}#bg{position:absolute;inset:0}#menu{position:relative;z-index:2;background:rgba(0,0,0,.7);padding:20px;border-radius:12px;text-align:center}.btn{display:block;width:220px;margin:10px auto;padding:12px}#game{display:none;padding:20px}#avatar{width:80px;height:80px;border-radius:50%;object-fit:cover}</style></head><body><section id="home"><canvas id="bg"></canvas><div id="menu"><h1>TETRIS</h1><img id="avatar" src="https://via.placeholder.com/80"><div id="playerName">Guest</div><div id="g_id_onload" data-client_id="YOUR_GOOGLE_CLIENT_ID" data-callback="handleCredentialResponse"></div><div class="g_id_signin"></div><button id="logout" class="btn">Logout</button><button id="newGame" class="btn">New Game</button><button id="continueGame" class="btn">Continue Game</button><button id="leaderboard" class="btn">Leaderboard</button></div></section><section id="game"><h2>Game Area</h2><p>Paste your existing Tetris game code here.</p><button id="saveBtn">Save Game</button></section><script>const saveKey='tetrisSave';function handleCredentialResponse(r){const d=JSON.parse(atob(r.credential.split('.')[1]));localStorage.setItem('profile',JSON.stringify({name:d.name,picture:d.picture}));loadProfile()}function loadProfile(){const p=JSON.parse(localStorage.getItem('profile')||'{}');if(p.name)playerName.textContent=p.name;if(p.picture)avatar.src=p.picture}loadProfile();logout.onclick=()=>{localStorage.removeItem('profile');location.reload()};newGame.onclick=()=>{home.style.display='none';game.style.display='block';saveGame()};continueGame.onclick=()=>{const s=localStorage.getItem(saveKey);if(s){home.style.display='none';game.style.display='block';}};function saveGame(){localStorage.setItem(saveKey,JSON.stringify({saved:new Date().toISOString()}))}saveBtn.onclick=saveGame;setInterval(saveGame,120000);document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveGame()}});const c=document.getElementById('bg'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;const b=[...Array(40)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:20+Math.random()*20,v:1+Math.random()*3}));(function a(){x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.25)';b.forEach(o=>{o.y+=o.v;if(o.y>c.height)o.y=-40;x.fillRect(o.x,o.y,o.s,o.s)});requestAnimationFrame(a)})()</script></body></html>
